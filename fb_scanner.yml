name: Facebook News Scanner

on:
  schedule:
    # Runs every hour, 6am-9pm Nairobi time (03:00-18:00 UTC)
    - cron: "0 3-18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the posted_log.json back

jobs:
  scan-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests feedparser pytz

      - name: Run scanner
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          python fb_news_scanner.py

      - name: Commit updated posted log
        run: |
          git config --global user.name "fb-scanner-bot"
          git config --global user.email "actions@github.com"
          git add posted_log.json
          git diff --staged --quiet || git commit -m "Update posted log"
          git push
