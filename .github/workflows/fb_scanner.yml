name: Kenya News Scanner (Suggestions)

on:
  schedule:
    # Every 15 minutes, 6am-9pm Nairobi time (03:00-18:00 UTC)
    - cron: "*/15 3-18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-and-suggest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser pytz

      - name: Run scanner
        run: |
          python fb_news_scanner.py

      - name: Commit suggestions and log
        run: |
          git config --global user.name "kenya-news-scanner"
          git config --global user.email "actions@github.com"
          git add suggested_posts.md posted_log.json
          git diff --staged --quiet || git commit -m "Update post suggestions"
          git push
