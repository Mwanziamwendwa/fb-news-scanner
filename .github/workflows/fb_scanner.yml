name: Facebook News Scanner

on:
  schedule:
    # Times are in UTC. Nairobi is UTC+3.
    # Runs at 07:00, 13:00, 18:00 Nairobi time = 04:00, 10:00, 15:00 UTC
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated log file

jobs:
  scan-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests pytz

      - name: Run scanner
        env:
          FB_PAGE_ID: ${{ secrets.PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python fb_news_scanner.py

      - name: Commit updated posted log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.json
          git diff --quiet --cached || git commit -m "Update posted log [skip ci]"
          git push
