name: Kenya News Scanner

on:
  schedule:
    # Runs every 2 hours (UTC). Nairobi is UTC+3, so adjust if you want
    # specific local times — cron here is always in UTC.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Needed so the workflow can push the updated suggested_posts.md /
# posted_log.json back to the repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser pytz

      - name: Run scanner
        run: python news_scanner.py   # rename to match your script's filename

      - name: Commit and push updated files
        run: |
          git config user.name "news-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add suggested_posts.md posted_log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scan run: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
