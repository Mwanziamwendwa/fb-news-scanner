name: FB News Scanner

# Manual trigger ONLY -- no schedule. This runs exclusively when you press
# "Run workflow" in the Actions tab (or via the GitHub app/API).
on:
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit state.json back

jobs:
  scan-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python fb_news_scanner.py

      - name: Commit updated state
        run: |
          git config user.name "fb-news-bot"
          git config user.email "fb-news-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update agent turn / posted story state"
          git push
