name: Kenya News Scanner and Facebook Publisher

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pytz requests

      - name: Run Kenya News Scanner
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          # Optional: set this only if you want to pin a specific
          # Facebook Graph API version.
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
        run: |
          python news_scanner.py

      - name: Commit scanner logs
        run: |
          git config user.name "Kenya News Scanner"
          git config user.email "actions@github.com"

          git add suggested_posts.md posted_log.json facebook_post_log.json

          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "Update Kenya news scanner logs"
            git push
          fi
